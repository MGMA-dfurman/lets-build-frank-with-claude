# Build -> test -> deploy. ONE container serving both the MCP server and the
# Cloudscape console (ADR-006, which partially supersedes ADR-004 and ADR-005).
#
# Fork setup (each student): NONE. Fork, push, done (ADR-010). This workflow
#   fetches the classroom credential itself from CREDENTIAL_URL below. Setting
#   AZURE_CREDENTIALS on a fork overrides that, which is the instructor's
#   manual override; nobody needs it in the normal case.
#   Your container app is named after your GitHub account, so nobody collides.
#
# decisions:historical
# Deliberately NOT here any more, and why:
#   - OIDC / id-token: write        -> needs a per-fork federated credential,
#                                     impossible for unknown attendees (ADR-006)
#   - environment: production       -> changed the OIDC subject claim and broke
#                                     federation; also gates deploys on approval
#   - AZURE_STATIC_WEB_APPS_API_TOKEN, SWA_NAME, FRANK_URL, VITE_FRANK_URL
#                                   -> Static Web Apps is gone; one target now
#
# PRs build and test only. Pushes to main deploy.

name: build-and-deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Classroom configuration. None of this is secret — it is the resource group,
# registry and environment your instructor created before class, shared by
# everyone. There is nothing for a student to set (ADR-010).
env:
  # The only value that has to be right. The registry and the Container Apps
  # environment are DISCOVERED from this group at deploy time, so a new class
  # does not mean editing this file — provision the group and go.
  AZURE_RESOURCE_GROUP: rg-frank-class

  # Where this pipeline gets its credential (ADR-010). Committed on purpose:
  # obscurity was never doing the work here, the cohort path and the service's
  # auto-close are. The service returns the credential base64-encoded, or an
  # empty 404 once the cohort is closed.
  CREDENTIAL_URL: https://frankclasssvc2ba9ef.azurewebsites.net/v1/b/2026-09

jobs:
  # These two run on PULL REQUESTS only — fast feedback with no Azure involved.
  # On main they are skipped: the Docker build compiles and tests both packages
  # exactly once, so running them here as well was ~140s of duplicated work.
  build-server:
    name: Build & test Frank (server/)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `server/` starts empty on purpose — you build it from the ADRs. Until you
      # have, there is nothing to install or test, so this job reports success
      # and says why. It starts doing real work the moment you commit a
      # package-lock.json, with no change to this file.
      - id: scaffolded
        run: |
          if [ -f server/package-lock.json ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=server/ not scaffolded yet::Nothing to build. Implement the ADRs, commit server/package-lock.json, and this job will build and test it."
          fi

      - uses: actions/setup-node@v5
        if: steps.scaffolded.outputs.yes == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - if: steps.scaffolded.outputs.yes == 'true'
        working-directory: server
        run: npm ci && npm test && npm run build

  build-ui:
    name: Build & test console (ui/)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `ui/` starts empty on purpose — you build it from the ADRs. Until you
      # have, there is nothing to install or test, so this job reports success
      # and says why. It starts doing real work the moment you commit a
      # package-lock.json, with no change to this file.
      - id: scaffolded
        run: |
          if [ -f ui/package-lock.json ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ui/ not scaffolded yet::Nothing to build. Implement the ADRs, commit ui/package-lock.json, and this job will build and test it."
          fi

      - uses: actions/setup-node@v5
        if: steps.scaffolded.outputs.yes == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - if: steps.scaffolded.outputs.yes == 'true'
        working-directory: ui
        run: npm ci && npm test && npm run build

  deploy:
    name: Deploy Frank -> Azure Container Apps
    if: github.event_name != 'pull_request'
    # No `needs:` — the build jobs are skipped on main by design, and a job
    # that needs a skipped job is itself skipped. The gate moved into the
    # Dockerfile, which runs `npm test` in both build stages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The student sets nothing up (ADR-010). A fork-level AZURE_CREDENTIALS
      # secret wins if it happens to be set; otherwise this fetches the
      # classroom credential. GitHub expands a missing secret to an EMPTY
      # STRING and az then fails with something unrelated-looking, so validate
      # here and fail loudly — this is the most common first-run mistake.
      - name: Resolve the classroom credential
        env:
          FORK_SECRET: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$FORK_SECRET" ]; then
            CREDS="$FORK_SECRET"
            echo "using the AZURE_CREDENTIALS secret set on this fork"
          else
            echo "no fork secret set - fetching the classroom credential (ADR-010)"
            B64=$(curl -fsS --max-time 20 "$CREDENTIAL_URL") || B64=""
            # Mask the ENCODED form before anything else touches it: it is
            # exactly as sensitive as the plaintext, and a public fork has
            # public Actions logs.
            [ -n "$B64" ] && echo "::add-mask::$B64"
            CREDS=$(printf '%s' "$B64" | base64 -d 2>/dev/null) || CREDS=""
          fi

          if [ -z "$CREDS" ]; then
            echo "::error::Could not get a classroom credential. The class may be over, or the service may be down - ask your instructor. (Setting AZURE_CREDENTIALS on your fork overrides this.)"
            exit 1
          fi
          echo "::add-mask::$CREDS"

          # Validates all four fields and hands back the one that is actually
          # secret. ADR-010 says plainly that the ids are not secret, and
          # masking them makes every later az error unreadable.
          CSECRET=$(printf '%s' "$CREDS" | python3 -c 'import json,sys; d=json.load(sys.stdin); [d[k] for k in ("clientId","subscriptionId","tenantId")]; print(d["clientSecret"])' 2>/dev/null) || CSECRET=""
          if [ -z "$CSECRET" ]; then
            echo "::error::That credential is not valid JSON with clientId/clientSecret/subscriptionId/tenantId. It has probably expired - ask your instructor."
            exit 1
          fi
          echo "::add-mask::$CSECRET"

          D=$(openssl rand -hex 8)
          { echo "AZURE_CREDS_JSON<<$D"; printf '%s\n' "$CREDS"; echo "$D"; } >> "$GITHUB_ENV"
          echo "credential resolved"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDS_JSON }}

      # Two explicit steps instead of `az containerapp up --source .`.
      #
      # `up --source` crashes on some azure-cli builds:
      #   _utils.py: platform_os = OS.linux.value
      #   AttributeError: 'NoneType' object has no attribute 'linux'
      # (the bundled containerregistry SDK models don't expose OS for 'runs').
      # Installing the containerapp extension does NOT help — it calls the same
      # core function. Building and deploying separately avoids that path, and
      # each half fails legibly on its own.
      # Your GitHub account name IS your isolation: the image, the container app
      # and the URL all carry it, so nobody collides and nobody is assigned a seat.
      - name: Work out who you are
        id: who
        run: |
          set -euo pipefail
          APP="frank-$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]-' | cut -c1-24)"

          # Discover the shared registry and environment your instructor created.
          ACR=$(az acr list -g "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv)
          ENV=$(az containerapp env list -g "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv)
          [ -n "$ACR" ] || { echo "::error::No container registry in $AZURE_RESOURCE_GROUP. Ask your instructor."; exit 1; }
          [ -n "$ENV" ] || { echo "::error::No Container Apps environment in $AZURE_RESOURCE_GROUP. Ask your instructor."; exit 1; }

          echo "app=$APP"     >> "$GITHUB_OUTPUT"
          echo "acr=$ACR"     >> "$GITHUB_OUTPUT"
          echo "env=$ENV"     >> "$GITHUB_OUTPUT"
          echo "image=$ACR.azurecr.io/$APP:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "deploying as $APP into $AZURE_RESOURCE_GROUP (acr=$ACR env=$ENV)"

      - name: Build the image in ACR
        run: |
          set -euo pipefail
          az acr build \
            --registry "${{ steps.who.outputs.acr }}" \
            --image "${{ steps.who.outputs.app }}:${{ github.sha }}" \
            --file Dockerfile .

      # One rendered spec, applied to both the create and the update path.
      #
      # Why YAML and not flags: ADR-004 requires a `GET /healthz` health probe
      # and ADR-006 keeps that decision in force, but `az containerapp
      # create|update` has NO probe flag — `--yaml` is the only way to set one,
      # and with `--yaml` "all other parameters will be ignored". So it is all
      # flags or all document; it cannot be flags plus a probe.
      #
      # What the missing probe cost: the Dockerfile's HEALTHCHECK is not used by
      # Container Apps (it says so itself), so the platform fell back to TCP
      # probing the ingress port. A Frank that binds 3000 but cannot serve /mcp —
      # a bad env var, a failed tool import — deployed green and only failed when
      # a student connected.
      - name: Create or update the Container App
        run: |
          set -euo pipefail
          APP="${{ steps.who.outputs.app }}"
          RG="$AZURE_RESOURCE_GROUP"
          ACR="${{ steps.who.outputs.acr }}"
          ENV_NAME="${{ steps.who.outputs.env }}"

          SUB=$(az account show --query id -o tsv)
          ENV_ID=$(az containerapp env show -g "$RG" -n "$ENV_NAME" --query id -o tsv)
          LOCATION=$(az containerapp env show -g "$RG" -n "$ENV_NAME" --query location -o tsv)

          # The registry admin user must be enabled for this to return anything.
          # It is a precondition of the shared registry, not of your fork, so say
          # so plainly rather than letting `az containerapp create` fail later
          # with an authentication error that points at the wrong thing.
          ACR_PW=$(az acr credential show --name "$ACR" --query 'passwords[0].value' -o tsv 2>/dev/null) || ACR_PW=""
          if [ -z "$ACR_PW" ]; then
            echo "::error::Could not read credentials for registry $ACR. Its admin user is probably disabled - ask your instructor to run 'az acr update -n $ACR --admin-enabled true'."
            exit 1
          fi
          echo "::add-mask::$ACR_PW"

          # Frank's Azure-reading tools (ADR-009) need to know WHICH resource group
          # he is in. There is deliberately no tool parameter for it — the scope is
          # read from the environment at boot so a caller cannot redirect him.
          # Frank reads Azure with the SAME credential that deployed him. That is
          # only reasonable because this one is public by design (ADR-010) — and it
          # removes the managed identity and the instructor's Reader handoff, which
          # is what made ADR-009 unimplementable.
          CREDS="$AZURE_CREDS_JSON"
          CID=$(printf '%s' "$CREDS" | python3 -c 'import json,sys;print(json.load(sys.stdin)["clientId"])')
          CSECRET=$(printf '%s' "$CREDS" | python3 -c 'import json,sys;print(json.load(sys.stdin)["clientSecret"])')
          TEN=$(printf '%s' "$CREDS" | python3 -c 'import json,sys;print(json.load(sys.stdin)["tenantId"])')

          # Rendered outside the workspace, mode 600, and removed however this
          # step exits: it holds the registry password and the client secret in
          # plaintext for as long as the two az calls below take.
          SPEC="$RUNNER_TEMP/frank-app.yaml"
          trap 'rm -f "$SPEC"' EXIT
          ( umask 077
            APP="$APP" IMAGE="${{ steps.who.outputs.image }}" ENV_ID="$ENV_ID" LOCATION="$LOCATION" \
            ACR_SERVER="$ACR.azurecr.io" ACR_USER="$ACR" ACR_PW="$ACR_PW" \
            SUB="$SUB" RG="$RG" CID="$CID" TEN="$TEN" CSECRET="$CSECRET" \
            python3 - "$SPEC" <<'PY'
          import json, os, sys

          # Hard limits from the Container Apps REST spec (ContainerAppProbe in
          # CommonDefinitions.json). The conceptual docs contradict these — they
          # show a Startup "default" failureThreshold of 240 and an example using
          # 48 — but those are platform-injected defaults, not values the API
          # accepts from you. Exceeding a limit is rejected at deploy time, so it
          # is caught here instead, where the error names the field.
          PROBE_LIMITS = {
              "initialDelaySeconds": 60,
              "periodSeconds": 240,
              "timeoutSeconds": 240,
              "failureThreshold": 10,
          }

          def probe(kind, initial_delay, period, failures):
              # Every probe hits the same endpoint ADR-001 specifies.
              spec = {
                  "type": kind,
                  "httpGet": {"path": "/healthz", "port": 3000},
                  "initialDelaySeconds": initial_delay,
                  "periodSeconds": period,
                  "timeoutSeconds": 3,
                  "failureThreshold": failures,
              }
              for field, maximum in PROBE_LIMITS.items():
                  value = spec[field]
                  if not 1 <= value <= maximum:
                      raise SystemExit(
                          f"{kind} probe: {field}={value} is outside the "
                          f"Container Apps range 1..{maximum}"
                      )
              return spec

          spec = {
              "location": os.environ["LOCATION"],
              "properties": {
                  "environmentId": os.environ["ENV_ID"],
                  "configuration": {
                      "activeRevisionsMode": "Single",
                      "ingress": {"external": True, "targetPort": 3000, "transport": "auto"},
                      "registries": [{
                          "server": os.environ["ACR_SERVER"],
                          "username": os.environ["ACR_USER"],
                          "passwordSecretRef": "acr-password",
                      }],
                      "secrets": [
                          {"name": "acr-password", "value": os.environ["ACR_PW"]},
                          {"name": "azure-client-secret", "value": os.environ["CSECRET"]},
                      ],
                  },
                  "template": {
                      "containers": [{
                          "name": "frank",
                          "image": os.environ["IMAGE"],
                          "env": [
                              {"name": "AZURE_SUBSCRIPTION_ID", "value": os.environ["SUB"]},
                              {"name": "AZURE_RESOURCE_GROUP", "value": os.environ["RG"]},
                              {"name": "AZURE_CLIENT_ID", "value": os.environ["CID"]},
                              {"name": "AZURE_TENANT_ID", "value": os.environ["TEN"]},
                              {"name": "AZURE_CLIENT_SECRET", "secretRef": "azure-client-secret"},
                          ],
                          # Startup gets the longest budget because min-replicas
                          # is 0 and a replica booting from cold must answer
                          # before the platform gives up on it: 10s delay plus
                          # 10 attempts at 15s is about 160 seconds. That is the
                          # most the API allows, since failureThreshold caps at
                          # 10. Note the budget covers process start only —
                          # probes begin after the container starts, so pulling
                          # the image does not eat into it.
                          "probes": [
                              probe("Startup", 10, 15, 10),
                              probe("Readiness", 3, 10, 3),
                              probe("Liveness", 10, 30, 3),
                          ],
                      }],
                      "scale": {"minReplicas": 0, "maxReplicas": 1},
                  },
              },
          }

          # JSON is valid YAML, and json.dump cannot mis-quote a secret that
          # happens to contain a colon, a quote or a leading dash.
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(spec, handle, indent=2)
          PY
          )

          if az containerapp show --name "$APP" --resource-group "$RG" >/dev/null 2>&1; then
            echo "updating existing app"
            az containerapp update --name "$APP" --resource-group "$RG" --yaml "$SPEC" -o none
          else
            echo "creating app"
            az containerapp create --name "$APP" --resource-group "$RG" --yaml "$SPEC" -o none
          fi

      # The probe is only worth adding if a broken one fails the build. This
      # checks the deployed revision, not a local container.
      - name: Verify the deployed revision is healthy
        run: |
          set -euo pipefail
          APP="${{ steps.who.outputs.app }}"
          RG="$AZURE_RESOURCE_GROUP"

          # Assert the SHAPE of the probes, not how many there are. A default TCP
          # probe, a probe on the wrong path, or three copies of one type would
          # all satisfy a >= 1 count while failing to check what ADR-004 asks for.
          # Parsed in python because JMESPath length() errors rather than
          # returning 0 when there are no probes — the exact state to catch.
          # Via a heredoc and a file, not `python3 -c '...'`: inside a
          # single-quoted shell string a backslash stays literal, so an escaped
          # quote in the Python becomes a syntax error that `bash -n` cannot see
          # and only the runner discovers.
          az containerapp show --name "$APP" --resource-group "$RG" \
            --query "properties.template.containers[0].probes" -o json > "$RUNNER_TEMP/probes.json"
          python3 - "$RUNNER_TEMP/probes.json" <<'PY'
          import json, sys

          probes = json.load(open(sys.argv[1], encoding="utf-8")) or []
          found = {}
          for entry in probes:
              found.setdefault(entry.get("type"), []).append(entry)

          problems = []
          for kind in ("Startup", "Readiness", "Liveness"):
              matching = found.get(kind, [])
              if len(matching) != 1:
                  problems.append(f"expected exactly one {kind} probe, found {len(matching)}")
                  continue
              http = matching[0].get("httpGet") or {}
              path = http.get("path")
              port = http.get("port")
              if path != "/healthz" or port != 3000:
                  problems.append(f"{kind} probe targets {path}:{port}, expected /healthz:3000")

          if problems:
              print("::error::Deployed probes do not satisfy ADR-004: " + "; ".join(problems))
              sys.exit(1)
          print(f"deployed revision declares {len(probes)} probes, all on /healthz:3000")
          PY

          # `show` returns the DESIRED template, so the checks above can pass
          # while the old revision is still the one serving traffic. In single
          # revision mode traffic only shifts once readiness succeeds, so wait
          # for the newest revision to actually be the ready one before believing
          # anything the FQDN says.
          DEADLINE=$(( $(date +%s) + 600 ))
          while :; do
            read -r LATEST READY <<<"$(az containerapp show --name "$APP" --resource-group "$RG" \
              --query '[properties.latestRevisionName, properties.latestReadyRevisionName]' -o tsv)"
            if [ -n "${LATEST:-}" ] && [ "$LATEST" = "${READY:-}" ]; then
              echo "revision $LATEST is the latest ready revision"
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Revision $LATEST never became ready (latest ready: ${READY:-none}). Its readiness probe is failing: az containerapp logs show -n $APP -g $RG"
              exit 1
            fi
            echo "waiting for $LATEST to become ready (currently ready: ${READY:-none})"
            sleep 10
          done

          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)

          # Deadline-based rather than a fixed attempt count: 30 attempts that
          # each spend up to 15s in curl and then sleep 10s is 12 minutes, not
          # the 5 it looks like. Scale-to-zero means the first request also pays
          # the cold start, so some retrying is still required.
          DEADLINE=$(( $(date +%s) + 300 ))
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            # `curl || echo 000` appends to the code curl already printed, giving
            # "000000" on a timeout. Capture the exit status separately instead.
            if CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$FQDN/healthz"); then
              :
            else
              CODE=000
            fi
            if [ "$CODE" = "200" ]; then
              echo "healthz answered 200 on attempt $attempt"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              break
            fi
            echo "attempt $attempt: healthz returned $CODE"
            sleep 5
          done
          echo "::error::Frank deployed but never answered 200 on /healthz. Check the container logs: az containerapp logs show -n $APP -g $RG"
          exit 1

      - name: Show Frank's URL
        run: |
          FQDN=$(az containerapp show \
            --name "${{ steps.who.outputs.app }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          # Ordered by what you do next, not by what exists. The console is
          # built late (ADR-003), so leading with it sends everyone to the one
          # link that says "not built yet". The connect command is spelled out
          # in full so nobody retypes a URL off a projector.
          {
            echo "### Frank is live"
            echo ""
            echo "Connect Claude Code to him:"
            echo ""
            echo '```bash'
            echo "claude mcp add --transport http frank https://$FQDN/mcp"
            echo '```'
            echo ""
            echo "Then **restart \`claude\`** and run \`/mcp\`. MCP servers load at"
            echo "session start, so a running session will not see him."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| MCP | https://$FQDN/mcp |"
            echo "| Health | https://$FQDN/healthz |"
            echo "| Console | https://$FQDN/ — once you build it (ADR-003) |"
          } >> "$GITHUB_STEP_SUMMARY"
